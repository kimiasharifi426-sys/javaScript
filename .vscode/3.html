<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>بلیت پرواز</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card">

    <div class="flight-info">
    
        <div class="top">
            <span class="tag">سیستمی</span>
            <span class="tag">اکونومی</span>
            <span class="tag">Airbus A321</span>
        </div>

        <div class="route">

            <div class="city">
                <span class="time">10:00</span>
                <h3>اصفهان</h3>
            </div>

            <div class="line">
                <div class="circle"></div>
                <div class="airplane">✈</div>
                <div class="circle"></div>
            </div>

            <div class="city">
                <span class="time">11:15</span>
                <h3>کیش</h3>
            </div>

        </div>

        <div class="bottom">
            <a href="#">اطلاعات پرواز</a>
            <a href="#">قوانین استرداد</a>
        </div>

    </div>

    <div class="price-box">

        <h2>۳,۵۰۰,۰۰۰</h2>
        <p>تومان</p>

        <h4>نرخ رسمی ایرلاین</h4>

        <button>انتخاب پرواز</button>

        <span class="remain">۹ صندلی باقی مانده</span>



    </div>

</div>

</body>
</html>
