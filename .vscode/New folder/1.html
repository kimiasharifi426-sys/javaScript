<html>
    <head>
        <title>ماشین حساب</title>
        <style>
            .container{
                width: 100%;
                height: 100vh;
                display: grid;
                grid-template-columns: repeat(5,1fr);
                grid-template-rows: repeat(6,1fr);
                row-gap: 7px;
                column-gap: 7px;
                background-color: black;
            }
            .box{
                display: flex;
                align-items: center;
                justify-content: center;
                font-size: 28px;
                
            }
            .box1{
                background-color: lightblue;
                grid-area:1/1/2/5;
            }
            .box2{
                background-color: blue;
                grid-area: 2/1/3/2;
            }
            .box3{
                background-color: blue;
                grid-area: 3/1/4/2;
            }
            .box4{
                background-color: blue;
                grid-area: 4/1/5/2;
            }
            .box5{
                background-color: black;
                grid-area: 5/1/6/2;
           }
           .box6{
            background-color: blue;
            grid-area: 5/2/6/3;
           }
           .box7{
            background-color: black;
            grid-area: 5/3/6/4;
           }
           .box8{
            background-color: blue;
            grid-area: 2/4/6/5;
           }
           .box9{
            background-color: blue;
            grid-area: 2/3/3/4;
           }
           .box10{
            background-color: blue;
            grid-area: 2/2/3/3;
           }
           .box11{
            background-color: blue;
            grid-area: 3/3/4/4;
           }
           .box12{
            background-color: blue;
            grid-area: 3/2/4/3;
           }
           .box13{
            background-color: blue;
            grid-area: 4/2/5/3;
           }
           .box14{
            background-color: blue;
            grid-area: 4/3/5/4;
           }


        </style>
    </head>
    <body>
        <div class="container">
            <div class="box box1">***</div>
            <div class="box box2">7</div>
            <div class="box box3">4</div>
            <div class="box box4">1</div>
            <div class="box box5"></div>
            <div class="box box6">0</div>
            <div class="box box7"></div>
            <div class="box box8">Enter</div>
            <div class="box box9">9</div>
            <div class="box box10">8</div>
            <div class="box box11">6</div>
            <div class="box box12">5</div>
            <div class="box box13">2</div>
            <div class="box box14">3</div>
        </div>
    </body>
</html>
